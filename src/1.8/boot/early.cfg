# early.cfg - Config embutida no core.img do GRUB (boot de HD).
# Sem normal.mod: menu direto + multiboot. $(root) via search.
set timeout=3
set default=0
echo "  #     #  #####"
echo "  ##   ## ##   ##"
echo "  # # # # ##     mapple 0.13.0 (HD)"
echo "  #  #  # ##  ###"
echo "  #     # ##   ##"
echo "  #     #  #####"
search --file --set=root /boot/kernel.elf
menuentry "mapple 0.13.0 (HD)" {
  multiboot /boot/kernel.elf
  module /boot/initrd.cpio
  boot
}
menuentry "mapple (sem initramfs)" {
  multiboot /boot/kernel.elf
  boot
}
